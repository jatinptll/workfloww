<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>WorkFlow | Your Work & Study Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>"
      type="image/svg+xml"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      /* --- 1. THEME ENGINE: CSS VARIABLES --- */
      :root {
        /* Light Mode (Default) */
        --bg-page: #f7f8fc;
        --bg-content: #ffffff;
        --bg-content-hover: #f3f4f6; /* gray-100 */
        --bg-input: #ffffff;
        --bg-accent: #3b82f6; /* Changed from purple to energetic blue */
        --bg-accent-hover: #2563eb; /* blue-700 */

        --text-primary: #1f2937; /* gray-800 */
        --text-secondary: #6b7280; /* gray-500 */
        --text-accent: #3b82f6; /* Changed to match new accent */
        --text-on-accent: #ffffff;
        
        --border-primary: #e5e7eb; /* gray-200 */
        --border-focus: #60a5fa;
        
        /* Status Colors */
        --status-todo-text: #ef4444; /* red-500 */
        --status-todo-bg: rgba(239, 68, 68, 0.1);
        --status-progress-text: #f59e0b; /* amber-500 */
        --status-progress-bg: rgba(245, 158, 11, 0.1);
        --status-done-text: #10b981; /* emerald-500 */
        --status-done-bg: rgba(16, 185, 129, 0.1);
        
        /* NEW: Attention Button Colors */
        --bg-attention: rgba(239, 68, 68, 0.1);
        --text-attention: #ef4444;
        --bg-attention-hover: rgba(239, 68, 68, 0.2);

        --shadow-color: rgba(0, 0, 0, 0.05);
        --modal-overlay-bg: rgba(17, 24, 39, 0.6);
        --scrollbar-thumb: #d1d5db;
        --scrollbar-thumb-hover: #9ca3af;

        --font-main: "Inter", sans-serif;
        
        transition: background-color 0.2s, color 0.2s;
      }

      html[data-theme="dim"] {
        /* Dim Mode */
        --bg-page: #15202B;
        --bg-content: #192734;
        --bg-content-hover: #1E2732;
        --bg-input: #253341;
        --bg-accent: #60a5fa; /* Lighter blue for dim mode */
        --bg-accent-hover: #93c5fd;

        --text-primary: #E1E8ED;
        --text-secondary: #8899A6;
        --text-accent: #60a5fa;
        --text-on-accent: #ffffff;

        --border-primary: #253341;
        --border-focus: #60a5fa;
        
        --status-todo-text: #f87171; /* red-400 */
        --status-todo-bg: rgba(248, 113, 113, 0.1);
        --status-progress-text: #fcd34d; /* yellow-400 */
        --status-progress-bg: rgba(252, 211, 77, 0.1);
        --status-done-text: #34d399; /* emerald-400 */
        --status-done-bg: rgba(52, 211, 153, 0.1);
        
        /* NEW: Attention Button Colors */
        --bg-attention: rgba(248, 113, 113, 0.1);
        --text-attention: #f87171;
        --bg-attention-hover: rgba(248, 113, 113, 0.2);

        --shadow-color: rgba(255, 255, 255, 0.05);
        --modal-overlay-bg: rgba(0, 0, 0, 0.7);
        --scrollbar-thumb: #38444D;
        --scrollbar-thumb-hover: #536471;
      }

      html[data-theme="dark"] {
        /* Dark Mode */
        --bg-page: #000000;
        --bg-content: #111111;
        --bg-content-hover: #1D1D1D;
        --bg-input: #1D1D1D;
        --bg-accent: #60a5fa; /* Lighter blue for dark mode */
        --bg-accent-hover: #93c5fd;

        --text-primary: #E7E9EA;
        --text-secondary: #71767B;
        --text-accent: #60a5fa;
        --text-on-accent: #ffffff;

        --border-primary: #2F3336;
        --border-focus: #60a5fa;
        
        --status-todo-text: #f87171;
        --status-todo-bg: rgba(248, 113, 113, 0.1);
        --status-progress-text: #fcd34d;
        --status-progress-bg: rgba(252, 211, 77, 0.1);
        --status-done-text: #34d399;
        --status-done-bg: rgba(52, 211, 153, 0.1);
        
        /* NEW: Attention Button Colors */
        --bg-attention: rgba(248, 113, 113, 0.1);
        --text-attention: #f87171;
        --bg-attention-hover: rgba(248, 113, 113, 0.2);

        --shadow-color: rgba(255, 255, 255, 0.1);
        --modal-overlay-bg: rgba(0, 0, 0, 0.8);
        --scrollbar-thumb: #2F3336;
        --scrollbar-thumb-hover: #525252;
      }

      /* --- 2. GLOBAL STYLES & RESETS --- */
      html,
      body {
        height: 100%;
        font-family: var(--font-main);
        background-color: var(--bg-page);
        color: var(--text-primary);
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--scrollbar-thumb);
        border-radius: 6px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--scrollbar-thumb-hover);
      }

      /* --- 3. THEME-AWARE COMPONENT STYLES --- */
      #sidebar {
        background-color: var(--bg-content);
        box-shadow: 0 4px 6px -1px var(--shadow-color);
      }
      #sidebar h1, #page-title { color: var(--text-primary); }
      #sidebar p, #page-subtitle, .text-gray-500 { color: var(--text-secondary); }
      .text-gray-800 { color: var(--text-primary); }
      .text-gray-600 { color: var(--text-secondary); }
      .text-gray-400 { color: var(--text-secondary); opacity: 0.8; }
      
      .sidebar-item { color: var(--text-secondary); }
      .sidebar-item:hover, .hover\:bg-gray-100:hover { 
        background-color: var(--bg-content-hover); 
        color: var(--text-primary);
      }
      .hover\:bg-indigo-50:hover { background-color: var(--bg-content-hover); }

      .sidebar-item-active {
        background: linear-gradient(90deg, var(--bg-content-hover), transparent);
        color: var(--text-accent);
        font-weight: 600;
        border-right: 3px solid var(--text-accent);
      }

      .kanban-column {
        background-color: var(--bg-content-hover);
        min-width: 300px;
        max-width: 320px;
      }
      .kanban-column h3 { color: var(--text-primary); }
      
      .card-dragging { opacity: 0.5; transform: rotate(3deg); }

      .status-badge {
        font-size: 0.7rem;
        padding: 0.2rem 0.6rem;
        border-radius: 9999px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      
      /* Themed Status Colors */
      .status-not-started { background-color: var(--status-todo-bg); color: var(--status-todo-text); }
      .border-not-started { border-left-color: var(--status-todo-text); }
      .status-in-progress { background-color: var(--status-progress-bg); color: var(--status-progress-text); }
      .border-in-progress { border-left-color: var(--status-progress-text); }
      .status-submitted { background-color: var(--status-done-bg); color: var(--status-done-text); }
      .border-submitted { border-left-color: var(--status-done-text); }
      
      /* NEW: Themed Attention Button */
      .btn-attention {
        background-color: var(--bg-attention);
        color: var(--text-attention);
      }
      .btn-attention:hover {
        background-color: var(--bg-attention-hover);
      }

      /* UPDATED: Added !important to override Tailwind */
      .card, #quick-add, .actions-popup, .modal-overlay > div, .bg-white {
        background-color: var(--bg-content) !important;
        border: 1px solid var(--border-primary);
        box-shadow: 0 1px 3px 0 var(--shadow-color), 0 1px 2px 0 var(--shadow-color);
      }
      .card { transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1); }
      .card:hover {
        transform: translateY(-4px);
        box-shadow: 0 10px 15px -3px var(--shadow-color), 0 4px 6px -2px var(--shadow-color);
      }
      .card h4 { color: var(--text-primary); }

      .modal-overlay {
        background-color: var(--modal-overlay-bg);
        backdrop-filter: blur(4px);
      }

      /* Forms */
      input, select {
        background-color: var(--bg-input);
        color: var(--text-primary);
        border: 1px solid var(--border-primary);
      }
      input::placeholder { color: var(--text-secondary); opacity: 0.7; }
      input:focus, select:focus {
        outline: none;
        border-color: var(--border-focus);
        box-shadow: 0 0 0 2px var(--border-focus);
      }
      
      /* Buttons */
      .bg-indigo-600 { background-color: var(--bg-accent); color: var(--text-on-accent); }
      .hover\:bg-indigo-700:hover { background-color: var(--bg-accent-hover); }
      .text-indigo-500 { color: var(--text-accent); }
      .hover\:text-indigo-700:hover { color: var(--text-accent); opacity: 0.8; }
      
      .modal-cancel, .border { border-color: var(--border-primary); }
      .modal-cancel:hover { background-color: var(--bg-content-hover); }
      
      .border-t { border-top-color: var(--border-primary); }
      
      /* UPDATED: Added !important to override Tailwind */
      .bg-gray-100 { background-color: var(--bg-content-hover) !important; }
      .bg-gray-200 { background-color: var(--bg-content-hover) !important; }
      
      /* --- UPDATED: UNIFIED ICON COLORS --- */
      [data-type="personal"] .subject-icon {
        color: #8b5cf6; /* Kept user's original purple for personal */
      }
      [data-type="academic"] .subject-icon {
        color: #a5b4fc; /* Kept user's original light purple for academic */
      }

      /* NEW: Management Modal Styles */
      .management-modal {
        max-width: 800px;
        width: 95%;
        max-height: 90vh;
        overflow-y: auto;
      }
      
      .management-section {
        background-color: var(--bg-content);
        border-radius: 0.5rem;
        padding: 1.25rem;
        margin-bottom: 1.5rem;
        box-shadow: 0 1px 3px 0 var(--shadow-color);
      }
      
      .management-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1rem;
      }
      
      .management-title {
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--text-primary);
      }
      
      .management-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.75rem;
        border-radius: 0.375rem;
        background-color: var(--bg-content-hover);
        margin-bottom: 0.5rem;
      }
      
      .management-item:hover {
        background-color: var(--bg-content-hover);
      }
      
      .management-item-info {
        display: flex;
        align-items: center;
        flex: 1;
      }
      
      .management-item-icon {
        margin-right: 0.75rem;
        width: 1.5rem;
        text-align: center;
      }
      
      .management-item-name {
        font-weight: 500;
        color: var(--text-primary);
      }
      
      .management-item-actions {
        display: flex;
        gap: 0.5rem;
      }
      
      .management-btn {
        padding: 0.5rem 1rem;
        border-radius: 0.375rem;
        font-size: 0.875rem;
        font-weight: 500;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      
      .management-btn-primary {
        background-color: var(--bg-accent);
        color: var(--text-on-accent);
      }
      
      .management-btn-primary:hover {
        background-color: var(--bg-accent-hover);
      }
      
      .management-btn-secondary {
        background-color: var(--bg-content-hover);
        color: var(--text-secondary);
        border: 1px solid var(--border-primary);
      }
      
      .management-btn-secondary:hover {
        background-color: var(--bg-content);
        color: var(--text-primary);
      }
      
      .management-btn-danger {
        background-color: var(--bg-attention);
        color: var(--text-attention);
      }
      
      .management-btn-danger:hover {
        background-color: var(--bg-attention-hover);
      }
      
      .management-form {
        display: flex;
        gap: 0.5rem;
        margin-top: 1rem;
      }
      
      .management-input {
        flex: 1;
        padding: 0.5rem 0.75rem;
        border-radius: 0.375rem;
        border: 1px solid var(--border-primary);
        background-color: var(--bg-input);
        color: var(--text-primary);
      }

      /* NEW: Category Management Styles */
      .category-management-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1rem;
        border-radius: 0.5rem;
        background-color: var(--bg-content);
        border: 1px solid var(--border-primary);
        margin-bottom: 0.75rem;
      }
      
      .category-management-info {
        display: flex;
        align-items: center;
        flex: 1;
      }
      
      .category-management-icon {
        margin-right: 0.75rem;
        width: 1.5rem;
        text-align: center;
        font-size: 1.125rem;
      }
      
      .category-management-name {
        font-weight: 600;
        color: var(--text-primary);
        font-size: 1.125rem;
      }
      
      .category-management-actions {
        display: flex;
        gap: 0.5rem;
      }
      
      /* Theme Switcher UI */
      #theme-switcher-ui {
        background-color: var(--bg-page);
        border: 1px solid var(--border-primary);
      }
      .theme-btn {
        color: var(--text-secondary);
        transition: all 0.2s ease-in-out;
        flex: 1;
        border: 2px solid transparent;
      }
      .theme-btn:hover {
        color: var(--text-primary);
      }
      .theme-btn.active {
        background-color: var(--bg-content);
        color: var(--text-accent);
        font-weight: 600;
        box-shadow: 0 1px 3px 0 var(--shadow-color);
        border: 2px solid var(--text-accent);
      }

      /* --- FIX 1: Improved action menu visibility --- */
      .actions-popup {
        min-width: 180px;
        z-index: 100;
      }
      .actions-popup a {
        display: flex;
        align-items: center;
        padding: 0.5rem 1rem;
        color: var(--text-primary);
        transition: all 0.15s ease;
        border-radius: 0.25rem;
        margin: 0.125rem;
      }
      .actions-popup a:hover {
        background-color: var(--bg-accent);
        color: var(--text-on-accent);
      }
      .actions-popup a.action-delete:hover {
        background-color: var(--bg-attention);
        color: var(--text-attention);
      }
      .actions-popup a i {
        width: 16px;
        margin-right: 0.75rem;
        text-align: center;
      }
      .actions-popup:not(.hidden) {
        display: block !important;
      }

      /* --- FIX 2: Improved sidebar item hover states (REMOVED TRANSFORM) --- */
      .sidebar-item {
        transition: all 0.2s ease;
        border-radius: 0.5rem;
        margin: 0.125rem 0;
      }
      .sidebar-item:hover {
        background-color: var(--bg-content-hover);
      }
      .sidebar-item-active {
        background: linear-gradient(90deg, rgba(59, 130, 246, 0.1), transparent);
        color: var(--text-accent);
        font-weight: 600;
        border-right: 3px solid var(--text-accent);
      }
      .sidebar-item-active:hover {
        background: linear-gradient(90deg, rgba(59, 130, 246, 0.15), transparent);
      }
      
      /* --- Global Manage Button Styles --- */
      #manage-all-btn {
        background-color: var(--bg-content-hover);
        color: var(--text-secondary);
      }
      #manage-all-btn:hover {
        color: var(--text-primary);
      }
      
      /* --- NEW: CSS for streamlined 'Add' buttons --- */
      .add-item-btn {
          display: flex;
          align-items: center;
          width: 100%;
          padding: 0.5rem 0.75rem; /* 8px 12px */
          margin-top: 0.25rem; /* 4px */
          font-size: 0.875rem; /* 14px */
          font-weight: 500;
          color: var(--text-secondary);
          border-radius: 0.375rem; /* 6px */
          transition: all 0.2s ease;
      }
      .add-item-btn:hover {
          background-color: var(--bg-content-hover);
          color: var(--text-primary);
      }
      .add-item-btn i {
          width: 24px; /* w-6 */
          margin-right: 0.75rem; /* ml-3 equivalent */
          text-align: center;
      }
      
      /* --- NEW: CSS for theme-aware data buttons (Fix 3) --- */
      .data-action-btn {
          color: var(--text-secondary);
      }
      .data-action-btn:hover {
          background-color: var(--bg-content-hover);
          color: var(--text-primary);
      }
    </style>
  </head>

  <body class="flex h-screen">
    <aside
      id="sidebar"
      class="w-72 p-4 shadow-lg flex-shrink-0 transition-transform duration-300 ease-in-out -translate-x-full sm:translate-x-0 z-20 flex flex-col"
    >
      <div class="flex items-center gap-3 mb-8">
        <span class="text-3xl">🚀</span>
        <div>
          <h1 class="text-xl font-bold">WorkFlow</h1>
          <p class="text-xs">Your Work & Study Hub</p>
        </div>
      </div>

      <nav id="subject-nav" class="space-y-2 mb-4">
        <a
          href="#"
          class="sidebar-item flex items-center py-2.5 px-3 rounded-lg transition-colors duration-200"
          data-subject="dashboard"
        >
          <i class="fas fa-home w-6"></i>
          <span class="ml-3">Dashboard</span>
        </a>
        <a
          href="#"
          class="sidebar-item flex items-center py-2.5 px-3 rounded-lg transition-colors duration-200"
          data-subject="academics-overview"
        >
          <i class="fas fa-graduation-cap w-6"></i>
          <span class="ml-3">Pending Academics</span>
        </a>
      </nav>

      <div class="flex-grow overflow-y-auto pr-2">
        <div class="px-1 mt-2">
          <button
            id="manage-all-btn"
            class="w-full flex items-center justify-center py-2 px-3 rounded-lg text-sm font-medium transition-colors"
            title="Manage categories & subjects"
          >
            <i class="fas fa-pencil-alt"></i>
            <span class="ml-2">Manage All</span>
          </button>
        </div>

        <div class="mt-4">
          <div class="flex items-center justify-between px-3 mb-2">
            <h3
              data-category="personal"
              class="text-xs font-semibold text-gray-400 uppercase tracking-wider"
            >
              Personal
            </h3>
          </div>
          <div id="personal-folder-list" class="mt-2 space-y-1"></div>
        </div>

        <div class="mt-6">
          <div class="flex items-center justify-between px-3 mb-2">
            <h3
              data-category="academics"
              class="text-xs font-semibold text-gray-400 uppercase tracking-wider"
            >
              Academics
            </h3>
          </div>
          <div id="subject-list" class="space-y-1"></div>
        </div>
      </div>

      <div class="mt-6 mb-2">
        <h3
          class="px-3 text-xs font-semibold text-gray-400 uppercase tracking-wider"
        >
          Theme
        </h3>
        <div
          class="mt-2 flex items-center justify-around rounded-lg p-1"
          id="theme-switcher-ui"
        >
          <button
            class="theme-btn px-3 py-1 text-sm font-medium rounded-md"
            data-theme="light"
            title="Light Mode"
          >
            ☀️ Light
          </button>
          <button
            class="theme-btn px-3 py-1 text-sm font-medium rounded-md"
            data-theme="dim"
            title="Dim Mode"
          >
            🌙 Dim
          </button>
          <button
            class="theme-btn px-3 py-1 text-sm font-medium rounded-md"
            data-theme="dark"
            title="Dark Mode"
          >
            🌑 Dark
          </button>
        </div>
      </div>

      <div class="mt-auto border-t pt-4 text-sm">
        <button
          id="export-btn"
          class="data-action-btn w-full flex items-center py-2 px-3 rounded transition-colors"
        >
          <i class="fas fa-download mr-3 w-5"></i>Export Data
        </button>
        <label class="w-full block mt-1">
          <input
            id="import-file"
            type="file"
            accept="application/json"
            class="hidden"
          />
          <span
            id="import-btn"
            class="data-action-btn w-full flex items-center py-2 px-3 rounded cursor-pointer transition-colors"
          >
            <i class="fas fa-upload mr-3 w-5"></i>Import Data
          </span>
        </label>
      </div>
    </aside>

    <div
      id="mobile-overlay"
      class="fixed inset-0 bg-black bg-opacity-50 z-10 hidden sm:hidden"
    ></div>

    <main class="flex-1 p-4 sm:p-6 lg:p-8 overflow-y-auto">
      <div class="max-w-7xl mx-auto">
        <header class="flex flex-wrap items-center justify-between gap-4 mb-8">
          <div class="flex items-center">
            <button
              id="mobile-menu-button"
              class="sm:hidden mr-3 p-2 rounded-lg"
            >
              <i class="fas fa-bars text-xl"></i>
            </button>
            <div>
              <h2 id="page-title" class="text-3xl font-bold">Dashboard</h2>
              <p id="page-subtitle" class="text-sm">
                Welcome back! Let's get things done.
              </p>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <div class="relative">
              <i
                class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2"
              ></i>
              <input
                id="global-search"
                type="search"
                placeholder="Search tasks..."
                class="pl-10 pr-4 py-2 text-sm border rounded-lg w-48"
              />
            </div>
            <button
              id="quick-add-toggle"
              class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-semibold hover:bg-indigo-700 transition-all duration-200 shadow-md hover:shadow-lg"
            >
              <i class="fas fa-plus mr-2"></i>New Task
            </button>
          </div>
        </header>

        <div id="quick-add" class="hidden rounded-lg p-4 shadow-md mb-6">
          <form id="quick-add-form" class="flex flex-wrap gap-3 items-center">
            <input
              id="quick-title"
              placeholder="Enter a new task title and press Enter..."
              class="flex-1 px-3 py-2 border rounded-lg"
              required
            />
            <input
              id="quick-due"
              type="date"
              class="px-3 py-2 border rounded-lg"
            />
            <select
              id="quick-subject"
              class="px-3 py-2 border rounded-lg"
            ></select>
            <button

    <script>
      // --- App State & Configuration ---
      const statusConfig = {
        "not-started": {
          label: "To Do",
          statusClass: "status-not-started",
          borderClass: "border-not-started",
          emoji: "🔴",
        },
        "in-progress": {
          label: "In Progress",
          statusClass: "status-in-progress",
          borderClass: "border-in-progress",
          emoji: "🟡",
        },
        submitted: {
          label: "Done",
          statusClass: "status-submitted",
          borderClass: "border-submitted",
          emoji: "🟢",
        },
      };

      const motivationalQuotes = [
        "The secret of getting ahead is getting started.",
        "Believe you can and you're halfway there.",
        "The only way to do great work is to love what you do.",
        "Success is not final, failure is not fatal: it is the courage to continue that counts.",
        "Don't watch the clock; do what it does. Keep going.",
      ];

      // UPDATED: Added categoryNames to default state
      let appData = { 
        subjects: [], 
        practicals: {}, 
        active: "dashboard",
        categoryNames: { personal: 'Personal', academics: 'Academics' }
      };
      let lastDeleted = null;
      let currentTheme = "light";

      // --- Theme Functions ---
      function applyTheme(theme) {
        document.documentElement.dataset.theme = theme;
        currentTheme = theme;
        localStorage.setItem("workflowTheme_v1", theme);
        document.querySelectorAll(".theme-btn").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.theme === theme);
        });
      }

      function loadTheme() {
        let savedTheme = localStorage.getItem("workflowTheme_v1");
        if (savedTheme) {
          applyTheme(savedTheme);
        } else {
          const prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          applyTheme(prefersDark ? "dim" : "light");
        }
      }

      // --- Utility Functions ---
      const uid = (prefix = "p") =>
        `${prefix}_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
      const save = () =>
        localStorage.setItem("zenithTracker_v1", JSON.stringify(appData));
      const escapeHtml = (s) =>
        s
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");

      function load() {
        const raw = localStorage.getItem("zenithTracker_v1");
        if (raw) {
          try {
            appData = JSON.parse(raw);
            
            // --- NEW: Data Migration Logic ---
            if (!appData.categoryNames) {
              appData.categoryNames = { personal: 'Personal', academics: 'Academics' };
            }
            if (appData.practicals['side-hustle']) {
              // Ensure "Building Things" subject exists
              if (!appData.subjects.find(s => s.id === 'building-things')) {
                appData.subjects.unshift({ id: 'building-things', name: 'Building Things', type: 'personal' });
              }
              // Move tasks
              if(!appData.practicals['building-things']) {
                  appData.practicals['building-things'] = [];
              }
              appData.practicals['building-things'] = appData.practicals['building-things'].concat(appData.practicals['side-hustle']);
              delete appData.practicals['side-hustle'];
              
              // If active was side-hustle, update it
              if (appData.active === 'side-hustle') {
                appData.active = 'building-things';
              }
            }
            // Ensure all subjects have a type
            appData.subjects.forEach(s => {
              if (!s.type) {
                // Legacy subjects are academic, except for our migrated one
                s.type = s.id === 'building-things' ? 'personal' : 'academic';
              }
            });
            // --- End Migration Logic ---

          } catch (e) {
            console.error("Error parsing saved data, resetting.", e);
            resetData();
          }
        } else {
          resetData();
        }
      }

      // UPDATED: resetData now includes new structure
      function resetData() {
        appData = {
          subjects: [
            { id: "building-things", name: "Building Things", type: "personal" },
            { id: "aad", name: "AAD", type: "academic" },
            { id: "dsmr", name: "DSMR", type: "academic" },
            { id: "ma", name: "M&A", type: "academic" },
          ],
          practicals: {
            "building-things": [],
            "aad": [],
            "dsmr": [],
            "ma": [],
          },
          active: "dashboard",
          categoryNames: { personal: 'Personal', academics: 'Academics' }
        };
        // Ensure all practicals lists exist
        appData.subjects.forEach((s) => {
          if (!appData.practicals[s.id]) {
            appData.practicals[s.id] = []
          }
        });
      }

      function showToast(text, isUndo = false) {
        const el = document.getElementById("snackbar");
        el.innerHTML = text;
        if (isUndo) {
          const btn = document.createElement("button");
          btn.className = "ml-4 underline font-semibold";
          btn.textContent = "Undo";
          btn.onclick = () => {
            undoDelete();
            hideToast();
          };
          el.appendChild(btn);
        }
        el.classList.remove("hidden");
        clearTimeout(el._t);
        el._t = setTimeout(hideToast, isUndo ? 6000 : 3000);
      }

      function hideToast() {
        document.getElementById("snackbar").classList.add("hidden");
      }

      function formatDate(dateStr) {
        if (!dateStr) return "No due date";
        try {
          return new Date(dateStr).toLocaleDateString("en-GB", {
            day: "2-digit",
            month: "short",
            year: "numeric",
          });
        } catch (e) {
          return "Invalid Date";
        }
      }

      function relativeDueText(datestr) {
        if (!datestr) return { text: "No due date", color: "text-gray-500" };
        const d = new Date(datestr);
d.setHours(0, 0, 0, 0);
        const t = new Date();
t.setHours(0, 0, 0, 0);
        const diff = Math.round((d - t) / (1000 * 60 * 60 * 24));
        if (diff < 0)
          return {
            text: `Overdue by ${Math.abs(diff)} day(s)`,
            color: "text-red-500 font-semibold",
          };
        if (diff === 0)
          return {
            text: "Due today",
            color: "text-amber-600 font-semibold",
          };
        if (diff === 1) return { text: "Due tomorrow", color: "" };
        return { text: `Due in ${diff} days`, color: "" };
      }

      // --- Rendering Engine ---
      function render() {
        save();
        renderSidebar();
        if (appData.active === "dashboard") {
          renderDashboard();
        } else if (appData.active === "academics-overview") {
          renderAcademicsOverview();
        } else {
          renderSubjectPage(appData.active);
        }
      }

      // UPDATED: renderSidebar now handles dynamic categories and types
      function renderSidebar() {
        const personalList = document.getElementById("personal-folder-list");
        const subjectList = document.getElementById("subject-list");
        personalList.innerHTML = "";
        subjectList.innerHTML = "";
        const subjectTpl = document.getElementById("subject-item-tpl")
          .innerHTML;

        // Set category header names
        document.querySelector('[data-category="personal"]').textContent = 
          (appData.categoryNames.personal || 'Personal').toUpperCase();
        document.querySelector('[data-category="academics"]').textContent = 
          (appData.categoryNames.academics || 'Academics').toUpperCase();

        // Render all subjects into their respective lists
        appData.subjects.forEach((s) => {
          const iconClass = s.type === 'personal' ? 'fa-star' : 'fa-book';
          const html = subjectTpl
            .replaceAll("__id__", s.id)
            .replace("__name__", escapeHtml(s.name))
            .replace("__iconClass__", iconClass)
            .replace("__type__", s.type);
          
          if (s.type === 'personal') {
            personalList.insertAdjacentHTML("beforeend", html);
          } else {
            subjectList.insertAdjacentHTML("beforeend", html);
          }
        });

        // Update all counts
        document
          .querySelectorAll("[data-count-id]")
          .forEach((el) => {
            const count = (appData.practicals[el.dataset.countId] || [])
              .length;
            el.textContent = count;
            el.classList.toggle("hidden", count === 0);
          });

        // Set active item
        document.querySelectorAll(".sidebar-item").forEach((it) => {
          it.classList.toggle(
            "sidebar-item-active",
            it.dataset.subject === appData.active
          );
        });

        // UPDATED: Quick subject dropdown now dynamic
        const quickSub = document.getElementById("quick-subject");
        quickSub.innerHTML = "";
        appData.subjects.forEach((s) => {
          const opt = document.createElement("option");
          const icon = s.type === 'personal' ? '🌟' : '📚';
          opt.value = s.id;
          opt.textContent = `${icon} ${s.name}`;
          quickSub.appendChild(opt);
        });
      }

      function renderDashboard() {
        document.getElementById("page-title").textContent = "Dashboard";
        document.getElementById("page-subtitle").textContent =
          "Welcome back! Let's get things done. 💪";
        const area = document.getElementById("content-area");

        let total = 0,
          done = 0,
          overdue = 0;
        const upcoming = [];
        const allPracticals = Object.values(appData.practicals).flat();

        allPracticals.forEach((p) => {
          total++;
          if (p.status === "submitted") done++;
          if (
            p.dueDate &&
            new Date(p.dueDate) < new Date() &&
            p.status !== "submitted"
          )
            overdue++;
          if (p.status !== "submitted" && p.dueDate) {
            upcoming.push(p);
          }
        });

        upcoming.sort((a, b) => {
            if (a.dueDate && b.dueDate) return new Date(a.dueDate) - new Date(b.dueDate);
            if (a.dueDate) return -1;
            if (b.dueDate) return 1;
            return 0;
        });
        const nextTasks = upcoming.slice(0, 5);
        const progress = total > 0 ? Math.round((done / total) * 100) : 0;
        const radius = 54;
        const circumference = 2 * Math.PI * radius;
        const offset = circumference - (progress / 100) * circumference;

        area.innerHTML = `
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <div class="lg:col-span-2 space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-md flex flex-wrap items-center justify-between gap-6">
              <div class="flex items-center gap-6">
                <div class="relative w-32 h-32">
                  <svg class="w-full h-full" viewBox="0 0 120 120">
                    <circle class="text-gray-200" stroke-width="12" stroke="currentColor" fill="transparent" r="${radius}" cx="60" cy="60"/>
                    <circle class="progress-ring-circle text-indigo-500" 
                            stroke-width="12" 
                            stroke-linecap="round" 
                            stroke="currentColor" 
                            fill="transparent" 
                            r="${radius}" 
                            cx="60" 
                            cy="60" 
                            style="stroke-dasharray: ${circumference}; stroke-dashoffset: ${offset};"
                            transform="rotate(-90 60 60)" />
                  </svg>
                  <div class="absolute inset-0 flex items-center justify-center text-2xl font-bold">${progress}%</div>
                </div>
                <div>
                  <h3 class="text-xl font-bold">Your Progress</h3>
                  <p>You've completed ${done} of ${total} tasks. Keep it up!</p>
                </div>
              </div>
              <div class="flex gap-4 text-center">
                <div><div class="text-2xl font-bold">${total}</div><div class="text-sm">Total</div></div>
                <div><div class="text-2xl font-bold text-green-500">${done}</div><div class="text-sm">Done</div></div>
                <div><div class="text-2xl font-bold text-red-500">${overdue}</div><div class="text-sm">Overdue</div></div>
              </div>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-md">
              <h3 class="font-bold text-xl mb-4">🗓️ Upcoming Deadlines</h3>
              ${
                nextTasks.length > 0
                  ? `<div class="space-y-3">${nextTasks
                      .map((p) => {
                        const subject = findSubjectByPracticalId(p.id);
                        const { text, color } = relativeDueText(p.dueDate);
                        const icon = subject && subject.type === 'personal' ? '🌟' : '📚';
                        const name = subject ? subject.name : 'Unknown';
                        
                        return `
                          <div class="p-3 bg-gray-100 rounded-lg flex items-center justify-between border-l-4 border-indigo-300">
                            <div>
                              <div class="font-semibold">${escapeHtml(
                                p.title
                              )}</div>
                              <div class="text-xs">${icon} ${escapeHtml(name)}</div>
                            </div>
                            <div class="text-sm text-right ${color}">${text}</div>
                          </div>`;
                      })
                      .join("")}</div>`
                  : `<p class="text-sm text-center py-4">No upcoming deadlines. You're all caught up!</p>`
              }
            </div>
          </div>
          <div class="space-y-6">
            <div class="bg-gradient-to-br from-indigo-500 to-purple-600 p-6 rounded-xl shadow-lg text-white">
              <h3 class="font-bold text-lg mb-2">💡 Food for Thought</h3>
              <p class="text-indigo-100 text-sm">"${
                motivationalQuotes[
                  Math.floor(Math.random() * motivationalQuotes.length)
                ]
              }"</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-md">
                <h3 class="font-bold text-xl mb-4">⚡ Quick Actions</h3>
                <div class="space-y-2">
                    <button id="focus-overdue" class="btn-attention w-full text-left py-2 px-3 rounded-lg transition-colors">
                        <i class="fas fa-exclamation-triangle w-5 mr-2"></i>Focus on Overdue Tasks
                    </button>
                    <button id="view-personal" class="w-full text-left py-2 px-3 hover:bg-gray-100 rounded-lg transition-colors">
                        <i class="fas fa-star w-5 mr-2"></i>View Personal Projects
                    </button>
                </div>
            </div>
          </div>
        </div>
      `;
      }

      function renderAcademicsOverview() {
        document.getElementById("page-title").textContent = "All Academics";
        document.getElementById("page-subtitle").textContent =
          "A combined view of all your pending academic tasks.";
        const area = document.getElementById("content-area");

        const academicTasks = [];
        appData.subjects.forEach((subject) => {
          // Only include 'academic' types
          if (subject.type === 'academic') {
            const tasks = appData.practicals[subject.id] || [];
            tasks.forEach((task) => {
              if (task.status !== "submitted") {
                academicTasks.push({ ...task, subjectName: subject.name });
              }
            });
          }
        });

        academicTasks.sort((a, b) => {
          if (a.dueDate && b.dueDate)
            return new Date(a.dueDate) - new Date(b.dueDate);
          if (a.dueDate) return -1;
          if (b.dueDate) return 1;
          return 0;
        });

        const search = document
          .getElementById("global-search")
          .value.trim()
          .toLowerCase();
        const filteredItems = academicTasks.filter(
          (p) => !search || p.title.toLowerCase().includes(search)
        );

        if (filteredItems.length === 0) {
          area.innerHTML = `
            <div class="bg-white p-6 rounded-xl shadow-md text-center">
                <h3 class="font-bold text-xl mb-2">🎉 All Clear!</h3>
                <p>You have no pending tasks across all your academic subjects. Great job!</p>
            </div>`;
          return;
        }

        const cardsHtml = filteredItems
          .map((p) => {
            const { text, color } = relativeDueText(p.dueDate);
            const cardHtml = document
              .getElementById("card-tpl")
              .innerHTML.replaceAll("__id__", p.id)
              .replace("__title__", escapeHtml(p.title))
              .replace("__dueText__", text)
              .replace("__dueColor__", color)
              .replace("__borderClass__", statusConfig[p.status].borderClass)
              .replace("__statusLabel__", statusConfig[p.status].label)
              .replace("__statusClass__", statusConfig[p.status].statusClass);

            const cardDom = document.createElement("div");
            cardDom.innerHTML = cardHtml;
            const subjectInfo = document.createElement("p");
            subjectInfo.className = "text-xs mt-1";
            subjectInfo.innerHTML = `<i class="fas fa-book mr-1.5"></i> ${escapeHtml(
              p.subjectName
            )}`;
            cardDom
              .querySelector(".card > div:first-child")
              .insertAdjacentElement("afterend", subjectInfo);

            return cardDom.innerHTML;
          })
          .join("");

        area.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">${cardsHtml}</div>`;

        attachCardEventListeners();
      }

      function renderSubjectPage(subjectId) {
        // UPDATED: Now finds any subject by ID
        const subject = appData.subjects.find((s) => s.id === subjectId);

        if (!subject) {
          appData.active = "dashboard";
          render();
          return;
        }

        document.getElementById("page-title").textContent = subject.name;
        document.getElementById("page-subtitle").textContent = `Organize your tasks for ${subject.name}`;
        const area = document.getElementById("content-area");

        const items = (appData.practicals[subjectId] || []).slice();
        const search = document
          .getElementById("global-search")
          .value.trim()
          .toLowerCase();
        const filteredItems = items.filter(
          (p) => !search || p.title.toLowerCase().includes(search)
        );

        const columns = ["not-started", "in-progress", "submitted"];
        const columnHtml = columns
          .map((col) => {
            const colItems = filteredItems.filter((i) => i.status === col);
            return document
              .getElementById("kanban-column-tpl")
              .innerHTML.replace("__title__", statusConfig[col].label)
              .replace("__emoji__", statusConfig[col].emoji)
              .replace("__status__", col)
              .replace("__count__", colItems.length);
          })
          .join("");

        area.innerHTML = `<div class="flex gap-6 overflow-x-auto pb-4">${columnHtml}</div>`;

        columns.forEach((col) => {
          const dropArea = area.querySelector(
            `.column-drop-area[data-status='${col}']`
          );
          const colItems = filteredItems.filter((i) => i.status === col);

          if (colItems.length) {
            colItems.forEach((p) => {
              const { text, color } = relativeDueText(p.dueDate);
              const cardHtml = document
                .getElementById("card-tpl")
                .innerHTML.replaceAll("__id__", p.id)
                .replace("__title__", escapeHtml(p.title))
                .replace("__dueText__", text)
                .replace("__dueColor__", color)
                .replace(
                  "__borderClass__",
                  statusConfig[p.status].borderClass
                )
                .replace("__statusLabel__", statusConfig[p.status].label)
                .replace(
                  "__statusClass__",
                  statusConfig[p.status].statusClass
                );
              dropArea.insertAdjacentHTML("beforeend", cardHtml);
            });
          } else {
            dropArea.innerHTML =
              '<div class="text-sm text-center py-10 border-2 border-dashed rounded-lg">Drag tasks here</div>';
          }
        });

        attachCardEventListeners();
        attachDragDrop();
      }

      // NEW: Management Modal Functions
      function openManagementModal() {
        const modalTpl = document.getElementById("management-modal-tpl").innerHTML;
        const modalWrap = document.createElement("div");
        modalWrap.innerHTML = modalTpl;
        document.getElementById("modals-container").appendChild(modalWrap);
        
        const modal = modalWrap.querySelector(".modal-overlay");
        
        // Render management lists
        renderManagementLists();
        
        // Close modal handlers
        modal.querySelectorAll(".modal-close").forEach(btn => {
          btn.addEventListener("click", () => modal.remove());
        });
        
        modal.addEventListener("click", (e) => {
          if (e.target === modal) modal.remove();
        });
        
        // Add button handlers
        modal.querySelector(".add-folder-btn").addEventListener("click", () => {
          showAddForm("personal");
        });
        
        modal.querySelector(".add-subject-btn").addEventListener("click", () => {
          showAddForm("academic");
        });
        
        // Cancel add handlers
        modal.querySelectorAll(".cancel-add-btn").forEach(btn => {
          btn.addEventListener("click", (e) => {
            e.preventDefault();
            hideAllAddForms();
          });
        });
        
        // Form submission handlers
        modal.querySelector("#add-personal-form").addEventListener("submit", (e) => {
          e.preventDefault();
          const input = e.target.querySelector("input");
          const name = input.value.trim();
          if (name) {
            addSubject(name, "personal");
            input.value = "";
            hideAllAddForms();
            renderManagementLists();
            render();
          }
        });
        
        modal.querySelector("#add-academic-form").addEventListener("submit", (e) => {
          e.preventDefault();
          const input = e.target.querySelector("input");
          const name = input.value.trim();
          if (name) {
            addSubject(name, "academic");
            input.value = "";
            hideAllAddForms();
            renderManagementLists();
            render();
          }
        });
        
        return modal;
      }
      
      function renderManagementLists() {
        const personalList = document.getElementById("personal-management-list");
        const academicList = document.getElementById("academic-management-list");
        const categoryList = document.getElementById("category-management-list");
        
        personalList.innerHTML = "";
        academicList.innerHTML = "";
        categoryList.innerHTML = "";
        
        // NEW: Render category management items
        categoryList.appendChild(createCategoryManagementItem("personal"));
        categoryList.appendChild(createCategoryManagementItem("academics"));
        
        // Render personal folders
        appData.subjects
          .filter(s => s.type === "personal")
          .forEach(subject => {
            personalList.appendChild(createManagementItem(subject));
          });
          
        // Render academic subjects
        appData.subjects
          .filter(s => s.type === "academic")
          .forEach(subject => {
            academicList.appendChild(createManagementItem(subject));
          });
      }
      
      // NEW: Create category management item
      function createCategoryManagementItem(categoryKey) {
        const item = document.createElement("div");
        item.className = "category-management-item";
        item.dataset.category = categoryKey;
        
        const icon = categoryKey === "personal" ? "fa-star" : "fa-graduation-cap";
        const displayName = appData.categoryNames[categoryKey] || 
                           (categoryKey === "personal" ? "Personal" : "Academics");
        
        item.innerHTML = `
          <div class="category-management-info">
            <div class="category-management-icon">
              <i class="fas ${icon}"></i>
            </div>
            <div class="category-management-name">${escapeHtml(displayName)}</div>
          </div>
          <div class="category-management-actions">
            <button class="management-btn management-btn-secondary edit-category-btn">
              <i class="fas fa-edit"></i>
              Edit Name
            </button>
          </div>
        `;
        
        // Add event listener for editing category name
        item.querySelector(".edit-category-btn").addEventListener("click", () => {
          openEditCategoryModal(categoryKey);
        });
        
        return item;
      }
      
      // NEW: Open edit category modal
      function openEditCategoryModal(categoryKey) {
        const currentName = appData.categoryNames[categoryKey] || 
                           (categoryKey === "personal" ? "Personal" : "Academics");
                           
        const modal = createModal(
          `✏️ Edit ${categoryKey === "personal" ? "Personal" : "Academics"} Category Name`,
          `<form class='space-y-4'>
            <div>
              <label for='category-name-edit' class='block text-sm font-medium mb-1'>Category Name</label>
              <input id='category-name-edit' value="${escapeHtml(
                currentName
              )}" class='w-full px-3 py-2 border rounded-lg' required/>
            </div>
            <div class='flex justify-end gap-2 pt-2'>
              <button type='button' class='modal-cancel px-4 py-2 border rounded-lg hover:bg-gray-100'>Cancel</button>
              <button class='px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700'>Save Changes</button>
            </div>
          </form>`
        );
        
        modal
          .querySelector(".modal-cancel")
          .addEventListener("click", () => modal.remove());
          
        modal.querySelector("form").addEventListener("submit", (e) => {
          e.preventDefault();
          const newName = modal.querySelector("#category-name-edit").value.trim();
          if (!newName) return;

          appData.categoryNames[categoryKey] = newName;
          modal.remove();
          render();
          renderManagementLists();
          showToast("Category name updated successfully!");
        });
      }
      
      function createManagementItem(subject) {
        const item = document.createElement("div");
        item.className = "management-item";
        item.dataset.id = subject.id;
        
        const icon = subject.type === "personal" ? "fa-star" : "fa-book";
        const taskCount = (appData.practicals[subject.id] || []).length;
        
        item.innerHTML = `
          <div class="management-item-info">
            <div class="management-item-icon">
              <i class="fas ${icon}"></i>
            </div>
            <div class="management-item-name">${escapeHtml(subject.name)}</div>
            <div class="ml-2 text-xs text-gray-500">(${taskCount} tasks)</div>
          </div>
          <div class="management-item-actions">
            <button class="management-btn management-btn-secondary edit-item-btn">
              <i class="fas fa-edit"></i>
              Edit
            </button>
            <button class="management-btn management-btn-danger delete-item-btn">
              <i class="fas fa-trash"></i>
              Delete
            </button>
          </div>
        `;
        
        // Add event listeners
        item.querySelector(".edit-item-btn").addEventListener("click", () => {
          openEditSubjectModal(subject.id);
        });
        
        item.querySelector(".delete-item-btn").addEventListener("click", () => {
          openDeleteSubjectModal(subject.id);
        });
        
        return item;
      }
      
      function showAddForm(type) {
        hideAllAddForms();
        
        if (type === "personal") {
          document.getElementById("add-personal-form").classList.remove("hidden");
          document.getElementById("add-personal-form").querySelector("input").focus();
        } else {
          document.getElementById("add-academic-form").classList.remove("hidden");
          document.getElementById("add-academic-form").querySelector("input").focus();
        }
      }
      
      function hideAllAddForms() {
        document.querySelectorAll(".management-form").forEach(form => {
          form.classList.add("hidden");
        });
      }
      
      function addSubject(name, type) {
        const id = name.toLowerCase().replace(/[^a-z0-9]+/g, "") + uid("s");
        appData.subjects.push({ id, name, type });
        appData.practicals[id] = [];
        renderManagementLists();
        render();
        showToast(`${type === 'personal' ? 'Folder' : 'Subject'} created successfully!`);
      }

      // --- Event Handlers & Logic ---
      
      // NEW: Helper to find subject name by ID
      function findSubjectNameById(sid) {
        const subject = appData.subjects.find(s => s.id === sid);
        return subject ? subject.name : "Unknown";
      }
      
      function findSubjectByPracticalId(pid) {
        for (const sid of Object.keys(appData.practicals)) {
          if (appData.practicals[sid] && appData.practicals[sid].some((x) => x.id === pid)) {
            return appData.subjects.find((s) => s.id === sid);
          }
        }
        return null;
      }

      function attachCardEventListeners() {
        document.querySelectorAll(".card").forEach((el) => {
          el.addEventListener("dragstart", (e) => {
            e.currentTarget.classList.add("card-dragging");
            e.dataTransfer.setData("text/plain", e.currentTarget.dataset.id);
          });
          el.addEventListener("dragend", (e) =>
            e.currentTarget.classList.remove("card-dragging")
          );

          const actionsBtn = el.querySelector(".card-actions");
          const popup = el.querySelector(".actions-popup");
          actionsBtn?.addEventListener("click", (ev) => {
            ev.stopPropagation();
            document
              .querySelectorAll(".actions-popup")
              .forEach((p) => p !== popup && p.classList.add("hidden"));
            popup.classList.toggle("hidden");
          });

          el.querySelectorAll(".action-set-status").forEach((a) =>
            a.addEventListener("click", (e) => {
              e.preventDefault();
              setPracticalStatusById(el.dataset.id, a.dataset.setStatus);
            })
          );
          el.querySelector(".action-delete")?.addEventListener("click", (e) => {
            e.preventDefault();
            deleteCardById(el.dataset.id);
          });
          el.querySelector(".action-edit")?.addEventListener("click", (e) => {
            e.preventDefault();
            openEditModal(el.dataset.id);
          });
        });
      }

      function setPracticalStatusById(id, newStatus) {
        for (const sid in appData.practicals) {
          if (!appData.practicals[sid]) continue;
          const p = appData.practicals[sid].find((x) => x.id === id);
          if (p) {
            p.status = newStatus;
            render();
            break;
          }
        }
      }

      function deleteCardById(id) {
        for (const sid in appData.practicals) {
          if (!appData.practicals[sid]) continue;
          const idx = appData.practicals[sid].findIndex((x) => x.id === id);
          if (idx > -1) {
            lastDeleted = {
              subjectId: sid,
              item: appData.practicals[sid][idx],
            };
            appData.practicals[sid].splice(idx, 1);
            render();
            showToast("Task deleted.", true);
            return;
          }
        }
      }

      function undoDelete() {
        if (lastDeleted) {
          if (!appData.practicals[lastDeleted.subjectId]) {
             appData.practicals[lastDeleted.subjectId] = [];
          }
          appData.practicals[lastDeleted.subjectId].push(lastDeleted.item);
          lastDeleted = null;
          render();
          showToast("Task restored!");
        }
      }

      function attachDragDrop() {
        document.querySelectorAll(".column-drop-area").forEach((area) => {
          area.ondragover = (ev) => {
            ev.preventDefault();
            area.classList.add("bg-indigo-100", "rounded-lg");
          };
          area.ondragleave = (ev) =>
            area.classList.remove("bg-indigo-100", "rounded-lg");
          area.ondrop = (ev) => {
            ev.preventDefault();
            area.classList.remove("bg-indigo-100", "rounded-lg");
            const id = ev.dataTransfer.getData("text/plain");
            if (id) setPracticalStatusById(id, area.dataset.status);
          };
        });
      }

      // --- Modals ---
      function createModal(title, innerHtml) {
        const wrap = document.createElement("div");
        wrap.className =
          "modal-overlay fixed inset-0 flex items-center justify-center z-50 p-4";
        wrap.innerHTML = `<div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6"> <div class='flex items-center justify-between mb-4'> <h3 class='text-xl font-bold'>${title}</h3> <button class='modal-close hover:text-gray-700'><i class='fas fa-times'></i></button></div><div>${innerHtml}</div></div>`;
        document.getElementById("modals-container").appendChild(wrap);
        wrap
          .querySelector(".modal-close")
          .addEventListener("click", () => wrap.remove());
        wrap.addEventListener("click", (e) => {
          if (e.target === wrap) wrap.remove();
        });
        return wrap;
      }

      function openEditSubjectModal(subjectId) {
        const subject = appData.subjects.find((s) => s.id === subjectId);
        if (!subject) return;

        modalTitle = subject.type === 'personal' ? '✏️ Edit Folder Name' : '✏️ Edit Subject Name';

        const modal = createModal(
          modalTitle,
          `<form id='edit-subj' class='space-y-4'>
            <div>
              <label for='s-name-edit' class='block text-sm font-medium mb-1'>Name</label>
              <input id='s-name-edit' value="${escapeHtml(
                subject.name
              )}" class='w-full px-3 py-2 border rounded-lg' required/>
            </div>
            <div class='flex justify-end gap-2 pt-2'>
              <button type='button' class='modal-cancel px-4 py-2 border rounded-lg hover:bg-gray-100'>Cancel</button>
              <button class='px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700'>Save Changes</button>
            </div>
          </form>`
        );
        modal
          .querySelector(".modal-cancel")
          .addEventListener("click", () => modal.remove());
        modal.querySelector("form").addEventListener("submit", (e) => {
          e.preventDefault();
          const newName = modal.querySelector("#s-name-edit").value.trim();
          if (!newName) return;

          const subj = appData.subjects.find((s) => s.id === subjectId);
          if (subj) {
            subj.name = newName;
          }

          modal.remove();
          render();
          renderManagementLists();
          showToast(`${subject.type === 'personal' ? 'Folder' : 'Subject'} updated successfully!`);
        });
      }

      function openDeleteSubjectModal(subjectId) {
        const subject = appData.subjects.find((s) => s.id === subjectId);
        if (!subject) return;

        const taskCount = (appData.practicals[subjectId] || []).length;
        const itemType = subject.type === 'personal' ? 'folder' : 'subject';

        const modal = createModal(
          `🗑️ Delete ${itemType}`,
          `<div class='space-y-4'>
            <p>Are you sure you want to delete the ${itemType} "<strong>${escapeHtml(
              subject.name
            )}</strong>"?</p>
            <p class='text-sm text-red-600 bg-red-50 p-3 rounded-lg'>
              <i class='fas fa-exclamation-triangle mr-2'></i>
              This action is permanent and will also delete <strong>${taskCount}</strong> associated task(s).
            </p>
            <div class='flex justify-end gap-2 pt-2'>
              <button type='button' class='modal-cancel px-4 py-2 border rounded-lg hover:bg-gray-100'>Cancel</button>
              <button id='confirm-delete' class='px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700'>Delete ${itemType}</button>
            </div>
          </div>`
        );
        modal
          .querySelector(".modal-cancel")
          .addEventListener("click", () => modal.remove());
        modal
          .querySelector("#confirm-delete")
          .addEventListener("click", () => {
            const idx = appData.subjects.findIndex((s) => s.id === subjectId);
            if (idx > -1) {
              appData.subjects.splice(idx, 1);
            }
            delete appData.practicals[subjectId];

            if (appData.active === subjectId) {
              appData.active = "dashboard";
            }

            modal.remove();
            render();
            renderManagementLists();
            showToast(`${itemType} deleted.`);
          });
      }

      function openEditModal(practicalId) {
        let subjectId = null,
          item = null;
        for (const sid in appData.practicals) {
            if (!appData.practicals[sid]) continue; // Safeguard
            const found = appData.practicals[sid].find(
                (x) => x.id === practicalId
            );
            if (found) {
                subjectId = sid;
                item = found;
                break;
            }
        }
        if (!item) return;

        const modal = createModal(
          "✏️ Edit Task",
          `<form class='space-y-4'>
            <div><label class='block text-sm font-medium mb-1'>Title</label><input id='e-title' class='w-full px-3 py-2 border rounded-lg' required /></div>
            <div><label class='block text-sm font-medium mb-1'>Due Date</label><input id='e-due' type='date' class='w-full px-3 py-2 border rounded-lg' /></div>
            <div class='flex gap-4'>
              <div class='flex-1'><label class='block text-sm font-medium mb-1'>Folder</label><select id='e-subject' class='w-full px-3 py-2 border rounded-lg'></select></div>
              <div><label class='block text-sm font-medium mb-1'>Status</label><select id='e-status' class='w-full px-3 py-2 border rounded-lg'></select></div>
            </div>
            <div class='flex justify-end gap-2 pt-2'><button type='button' class='modal-cancel px-4 py-2 border rounded-lg'>Cancel</button><button class='px-4 py-2 bg-indigo-600 text-white rounded-lg'>Save Changes</button></div>
          </form>`
        );

        // UPDATED: Dynamic subject dropdown in edit modal
        const subjSelect = modal.querySelector("#e-subject");
        subjSelect.innerHTML = "";
        appData.subjects.forEach((s) => {
          const icon = s.type === 'personal' ? '🌟' : '📚';
          subjSelect.innerHTML += `<option value='${s.id}'>${icon} ${s.name}</option>`;
        });

        const statusSelect = modal.querySelector("#e-status");
        Object.keys(statusConfig).forEach((key) => {
          statusSelect.innerHTML += `<option value='${key}'>${statusConfig[key].label}</option>`;
        });

        modal.querySelector("#e-title").value = item.title;
        modal.querySelector("#e-due").value = item.dueDate || "";
        subjSelect.value = subjectId;
        statusSelect.value = item.status;

        modal
          .querySelector(".modal-close")
          .addEventListener("click", () => modal.remove());
        modal.querySelector("form").addEventListener("submit", (e) => {
          e.preventDefault();
          const newTitle = modal.querySelector("#e-title").value.trim();
          if (!newTitle) return;

          const newSub = modal.querySelector("#e-subject").value;
          if (newSub !== subjectId) {
            const idx = appData.practicals[subjectId].findIndex(
              (x) => x.id === item.id
            );
            if (idx > -1) appData.practicals[subjectId].splice(idx, 1);
            
            // Ensure the new subject practicals array exists
            if (!appData.practicals[newSub]) {
              appData.practicals[newSub] = [];
            }
            appData.practicals[newSub].push(item);
          }
          item.title = newTitle;
          item.dueDate = modal.querySelector("#e-due").value || null;
          item.status = modal.querySelector("#e-status").value;
          modal.remove();
          render();
        });
      }

      // --- Import/Export ---
      function exportJSON() {
        const blob = new Blob([JSON.stringify(appData, null, 2)], {
          type: "application/json",
        });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "zenith-data.json";
        a.click();
        URL.revokeObjectURL(a.href);
      }

      function importJSON(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const parsed = JSON.parse(e.target.result);
            if (!parsed.subjects || !parsed.practicals)
              throw new Error("Invalid format");
            appData = parsed;
            // Run load() again to process and migrate imported data if needed
            load(); 
            render();
            showToast("Import successful!");
          } catch (err) {
            alert("Error: Invalid file format.");
          }
        };
        reader.readAsText(file);
      }

      // --- Initial Setup & Event Listeners ---
      document.addEventListener("DOMContentLoaded", () => {
        load();
        loadTheme();
        render();

        // Sidebar navigation
        document.body.addEventListener("click", (e) => {
          const sidebarItem = e.target.closest(".sidebar-item");
          if (sidebarItem) {
            e.preventDefault();
            appData.active = sidebarItem.dataset.subject;
            render();
            if (window.innerWidth < 640) {
              document
                .getElementById("sidebar")
                .classList.add("-translate-x-full");
              document.getElementById("mobile-overlay").classList.add("hidden");
            }
          }
        });

        // Mobile menu
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("mobile-overlay");
        document
          .getElementById("mobile-menu-button")
          .addEventListener("click", () => {
            sidebar.classList.toggle("-translate-x-full");
            overlay.classList.toggle("hidden");
          });
        overlay.addEventListener("click", () => {
          sidebar.classList.add("-translate-x-full");
          overlay.classList.add("hidden");
        });

        // Global Manage Button Listener
        const manageAllBtn = document.getElementById("manage-all-btn");
        manageAllBtn.addEventListener("click", () => {
          openManagementModal();
        });
        
        // Theme Switcher Logic
        document.querySelectorAll(".theme-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            applyTheme(btn.dataset.theme);
          });
        });

        // Quick add
        document
          .getElementById("quick-add-toggle")
          .addEventListener("click", () => {
            document.getElementById("quick-add").classList.toggle("hidden");
            document.getElementById("quick-title").focus();
          });
        document
          .getElementById("quick-add-form")
          .addEventListener("submit", (e) => {
            e.preventDefault();
            const title = document.getElementById("quick-title").value.trim();
            const subjectId = document.getElementById("quick-subject").value;
            if (!title || !subjectId) return;
            
            // Ensure array exists before pushing
            if (!appData.practicals[subjectId]) {
              appData.practicals[subjectId] = [];
            }
            
            appData.practicals[subjectId].push({
              id: uid(),
              title,
              dueDate: document.getElementById("quick-due").value || null,
              status: "not-started",
              createdAt: Date.now(),
            });
            e.target.reset();
            document.getElementById("quick-title").focus(); // Keep focus for rapid entry
            render();
          });

        // Search
        document
          .getElementById("global-search")
          .addEventListener("input", () => render());

        // Import/Export
        document
          .getElementById("export-btn")
          .addEventListener("click", exportJSON);
        document
          .getElementById("import-btn")
          .addEventListener("click", () =>
            document.getElementById("import-file").click()
          );
        document
          .getElementById("import-file")
          .addEventListener("change", (e) => {
            if (e.target.files.length) importJSON(e.target.files[0]);
          });

        // Dashboard Actions
        document.body.addEventListener("click", (e) => {
          if (e.target.closest("#focus-overdue")) {
            showToast("Feature coming soon: A dedicated 'Overdue' focus mode!");
          }
          if (e.target.closest("#view-personal")) {
            // UPDATED: Clicks the first personal folder it finds
            const firstPersonal = appData.subjects.find(s => s.type === 'personal');
            if (firstPersonal) {
              appData.active = firstPersonal.id;
              render();
            } else {
              showToast("No personal folders found.");
            }
          }
        });

        // Global click listener to close popups
        document.addEventListener("click", (e) => {
          if (
            !e.target.closest(".actions-popup") &&
            !e.target.closest(".card-actions")
          ) {
            document
              .querySelectorAll(".actions-popup")
              .forEach((p) => p.classList.add("hidden"));
          }
        });

        // Keyboard shortcuts
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            document
              .querySelectorAll(".modal-overlay")
              .forEach((m) => m.remove());
            document
              .querySelectorAll(".actions-popup")
              .forEach((p) => p.classList.add("hidden"));
          }
        });
      });
    </script>
  </body>
</html>
